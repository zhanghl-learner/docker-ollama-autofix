name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for JavaScript property contracts
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify clean Git workspace contract
        run: autofix git-status . --json --require-clean

      - name: Verify frozen evaluation corpus
        run: >-
          autofix benchmark-verify examples/complex-validation
          --output "${{ runner.temp }}/autofix-benchmark-verification.json"
          --json

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run automated tests through AutoFix CI contract
        run: >-
          autofix ci-check .
          --command "python -m pytest -q --junitxml=pytest-results.xml"
          --output "${{ runner.temp }}/autofix-ci-result.json"

      - name: Publish pytest failure annotations
        if: failure()
        shell: pwsh
        run: |
          [xml]$report = Get-Content -LiteralPath pytest-results.xml -Raw
          $failed = $report.SelectNodes('//testcase[failure or error]')
          foreach ($case in $failed) {
            $detail = if ($case.failure) { $case.failure.InnerText } else { $case.error.InnerText }
            $message = "$($case.classname)::$($case.name)`n$detail"
            $encoded = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pytest failure::$encoded"
          }
          if (-not $failed) {
            Write-Output '::error title=pytest failure::pytest failed without a JUnit failure node'
          }

      - name: Upload AutoFix CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autofix-ci-${{ runner.os }}
          path: |
            ${{ runner.temp }}/autofix-ci-result.json
            ${{ runner.temp }}/autofix-benchmark-verification.json
            pytest-results.xml
          if-no-files-found: warn

      - name: Validate Python evaluation baseline
        run: autofix evaluate examples/complex-validation/python-order-service --no-save

      - name: Validate pinned upstream Python evaluation baseline
        run: autofix evaluate examples/complex-validation/python-more-itertools-take --no-save

      - name: Validate Node evaluation baseline
        run: autofix evaluate examples/complex-validation/node-checkout-service --no-save

      - name: Validate real JavaScript property worktree contract
        run: >-
          python -m pytest tests/test_javascript_property.py -q
          -k "real_differential_loop or apply_cli_real_worktree_json_matches_schema"

  docker-self-host:
    name: Docker self-host
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AutoFix
        run: python -m pip install -e ".[dev]"

      - name: Build constrained Python image
        run: docker build --file docker/python.Dockerfile --tag autofix-python:3.11 .

      - name: Run AutoFix inside Docker
        run: autofix run . --docker --no-save

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          autofix --version
          autofix inspect . --json
          autofix property-js-apply --help
          autofix benchmark-verify --help
          autofix evaluation-trend --help
