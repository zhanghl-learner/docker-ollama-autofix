name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run automated tests
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Publish pytest failure annotations
        if: failure()
        shell: pwsh
        run: |
          [xml]$report = Get-Content -LiteralPath pytest-results.xml -Raw
          $failed = $report.SelectNodes('//testcase[failure or error]')
          foreach ($case in $failed) {
            $detail = if ($case.failure) { $case.failure.InnerText } else { $case.error.InnerText }
            $message = "$($case.classname)::$($case.name)`n$detail"
            $encoded = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=pytest failure::$encoded"
          }
          if (-not $failed) {
            Write-Output '::error title=pytest failure::pytest failed without a JUnit failure node'
          }

      - name: Validate Python evaluation baseline
        run: autofix evaluate examples/complex-validation/python-order-service --no-save

      - name: Validate Node evaluation baseline
        run: autofix evaluate examples/complex-validation/node-checkout-service --no-save

  docker-self-host:
    name: Docker self-host
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AutoFix
        run: python -m pip install -e ".[dev]"

      - name: Build constrained Python image
        run: docker build --file docker/python.Dockerfile --tag autofix-python:3.11 .

      - name: Run AutoFix inside Docker
        run: autofix run . --docker --no-save

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          autofix --version
          autofix inspect . --json
