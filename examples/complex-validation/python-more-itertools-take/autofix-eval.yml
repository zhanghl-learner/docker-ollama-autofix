version: 1
name: python-more-itertools-take-boundary
language: Python
difficulty: intermediate
commands:
  - python -m compileall -q src tests
  - python -m unittest discover -s tests -v
expected_failure:
  exit_code: 1
  failed_step: 2
  output_contains:
    - test_take_returns_requested_prefix
    - "AssertionError: Lists differ: [0, 1] != [0, 1, 2]"
  output_excludes:
    - ModuleNotFoundError
    - No module named
allowed_change_paths:
  - src/upstream_recipes.py
required_change_paths:
  - src/upstream_recipes.py
tags:
  - upstream-derived
  - boundary-condition
  - pinned-commit
  - offline
